## ============================================================
## EMQX Access Control List (ACL)
## Controls which MQTT clients can publish/subscribe to which topics
## ============================================================
##
## Format: {allow|deny}, {all|user:<username>|ipaddr:<ip>}, {publish|subscribe|all}, ["topic"]
##
## Topic wildcards:
##   +  = single level  (smartsignal/mumbai/+/beacon matches any vehicle)
##   #  = multi level   (smartsignal/# matches everything under smartsignal/)
##
## ============================================================

## ── Cloud Service Account (ss_service) ──────────────────────
## Can subscribe to ALL vehicle beacons and node events
## Can publish alerts and config to nodes

{allow, user:"ss_service", subscribe, "smartsignal/#"}
{allow, user:"ss_service", publish,   "smartsignal/+/node/+/alert"}
{allow, user:"ss_service", publish,   "smartsignal/+/node/+/config/update"}
{allow, user:"ss_service", publish,   "smartsignal/+/node/+/ota"}

## ── Edge Node Accounts (pattern: node_<node_id>) ────────────
## Each node can only publish to its own topics and subscribe to its own alerts

{allow, user:"node_NODE-MH-001", publish,   "smartsignal/mumbai/node/NODE-MH-001/#"}
{allow, user:"node_NODE-MH-001", subscribe, "smartsignal/mumbai/node/NODE-MH-001/alert"}
{allow, user:"node_NODE-MH-001", subscribe, "smartsignal/mumbai/node/NODE-MH-001/config/update"}
{allow, user:"node_NODE-MH-001", subscribe, "smartsignal/mumbai/node/NODE-MH-001/ota"}
{allow, user:"node_NODE-MH-001", subscribe, "smartsignal/mumbai/vehicle/+/beacon"}

{allow, user:"node_NODE-MH-002", publish,   "smartsignal/mumbai/node/NODE-MH-002/#"}
{allow, user:"node_NODE-MH-002", subscribe, "smartsignal/mumbai/node/NODE-MH-002/#"}
{allow, user:"node_NODE-MH-002", subscribe, "smartsignal/mumbai/vehicle/+/beacon"}

{allow, user:"node_NODE-MH-003", publish,   "smartsignal/mumbai/node/NODE-MH-003/#"}
{allow, user:"node_NODE-MH-003", subscribe, "smartsignal/mumbai/node/NODE-MH-003/#"}
{allow, user:"node_NODE-MH-003", subscribe, "smartsignal/mumbai/vehicle/+/beacon"}

{allow, user:"node_NODE-MH-004", publish,   "smartsignal/mumbai/node/NODE-MH-004/#"}
{allow, user:"node_NODE-MH-004", subscribe, "smartsignal/mumbai/node/NODE-MH-004/#"}
{allow, user:"node_NODE-MH-004", subscribe, "smartsignal/mumbai/vehicle/+/beacon"}

{allow, user:"node_NODE-DL-001", publish,   "smartsignal/delhi/node/NODE-DL-001/#"}
{allow, user:"node_NODE-DL-001", subscribe, "smartsignal/delhi/node/NODE-DL-001/#"}
{allow, user:"node_NODE-DL-001", subscribe, "smartsignal/delhi/vehicle/+/beacon"}

{allow, user:"node_NODE-DL-002", publish,   "smartsignal/delhi/node/NODE-DL-002/#"}
{allow, user:"node_NODE-DL-002", subscribe, "smartsignal/delhi/node/NODE-DL-002/#"}
{allow, user:"node_NODE-DL-002", subscribe, "smartsignal/delhi/vehicle/+/beacon"}

## ── Vehicle Accounts (pattern: vsu_<vehicle_id>) ────────────
## Vehicles can ONLY publish their own beacon and priority topics

{allow, user:"vsu_AMB-MH-001", publish,   "smartsignal/mumbai/vehicle/AMB-MH-001/#"}
{allow, user:"vsu_AMB-MH-002", publish,   "smartsignal/mumbai/vehicle/AMB-MH-002/#"}
{allow, user:"vsu_AMB-MH-003", publish,   "smartsignal/mumbai/vehicle/AMB-MH-003/#"}
{allow, user:"vsu_FIRE-MH-001", publish,  "smartsignal/mumbai/vehicle/FIRE-MH-001/#"}
{allow, user:"vsu_FIRE-MH-002", publish,  "smartsignal/mumbai/vehicle/FIRE-MH-002/#"}
{allow, user:"vsu_POL-MH-001",  publish,  "smartsignal/mumbai/vehicle/POL-MH-001/#"}
{allow, user:"vsu_AMB-DL-001",  publish,  "smartsignal/delhi/vehicle/AMB-DL-001/#"}
{allow, user:"vsu_AMB-DL-002",  publish,  "smartsignal/delhi/vehicle/AMB-DL-002/#"}
{allow, user:"vsu_FIRE-DL-001", publish,  "smartsignal/delhi/vehicle/FIRE-DL-001/#"}

## ── Dashboard WebSocket client ───────────────────────────────
{allow, user:"dashboard", subscribe, "smartsignal/#"}

## ── Deny everything else ─────────────────────────────────────
{deny, all, all, "#"}
