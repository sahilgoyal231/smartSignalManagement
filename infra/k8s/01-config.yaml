apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-signal-config
  namespace: smart-signal
data:
  DB_HOST: "postgres-service.smart-signal.svc.cluster.local"
  DB_PORT: "5432"
  KAFKA_BROKERS: "kafka-service.smart-signal.svc.cluster.local:9092"
  MQTT_BROKER: "mqtt-service.smart-signal.svc.cluster.local"
  MQTT_PORT: "1883"
  ENVIRONMENT: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: smart-signal-secrets
  namespace: smart-signal
type: Opaque
stringData:
  # In a real setup, these would be managed by ExternalSecrets or SealedSecrets
  DB_USER: "postgres_user"
  DB_PASSWORD: "super_secure_password"
  REDIS_PASSWORD: "redis_password"
  MQTT_USER: "cloud_backend"
  MQTT_PASSWORD: "mqtt_password"
