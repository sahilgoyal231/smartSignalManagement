# Event Service (with WebSocket Streaming)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: smart-signal
  labels:
    app: event-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
      - name: event-service
        image: smartsignal/event-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: smart-signal-config
        - secretRef:
            name: smart-signal-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: event-service-svc
  namespace: smart-signal
spec:
  # LoadBalancer type or Ingress required for external WebSocket connections to Dashboard
  type: ClusterIP 
  selector:
    app: event-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
