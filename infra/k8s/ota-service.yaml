apiVersion: apps/v1
kind: Deployment
metadata:
  name: ota-service
  namespace: smart-signal
  labels:
    app: ota-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ota-service
  template:
    metadata:
      labels:
        app: ota-service
    spec:
      containers:
      - name: ota-service
        image: smartsignal/ota-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: smart-signal-config
        - secretRef:
            name: smart-signal-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: ota-service-svc
  namespace: smart-signal
spec:
  type: ClusterIP
  selector:
    app: ota-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8004
