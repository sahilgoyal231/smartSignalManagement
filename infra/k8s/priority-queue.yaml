apiVersion: apps/v1
kind: Deployment
metadata:
  name: priority-queue
  namespace: smart-signal
  labels:
    app: priority-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: priority-queue
  template:
    metadata:
      labels:
        app: priority-queue
    spec:
      containers:
      - name: priority-queue
        image: smartsignal/priority-queue:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: smart-signal-config
        - secretRef:
            name: smart-signal-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        # Reads from Redis Pub/Sub (route-engine output) and publishes to MQTT
