# Vehicle Registry Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-registry
  namespace: smart-signal
  labels:
    app: vehicle-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-registry
  template:
    metadata:
      labels:
        app: vehicle-registry
    spec:
      containers:
      - name: vehicle-registry
        image: smartsignal/vehicle-registry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: smart-signal-config
        - secretRef:
            name: smart-signal-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-registry-svc
  namespace: smart-signal
spec:
  selector:
    app: vehicle-registry
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
