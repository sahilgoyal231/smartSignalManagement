services:
  - type: web
    name: event-service
    env: python
    buildCommand: "pip install -r cloud/requirements-light.txt"
    startCommand: "uvicorn cloud.services.event_service.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: /opt/render/project/src

